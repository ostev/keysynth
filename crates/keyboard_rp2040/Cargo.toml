[package]
name = "keyboard_rp2040"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "time-driver",
    "critical-section-impl",
    "rp2040",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
portable-atomic = { version = "1.13.1", features = ["critical-section"] }

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"

static_cell = "2.1.1"

keyboard_protocol = { path = "../keyboard_protocol" }
postcard = "1.1.3"
embedded-io = "0.7.1"
defmt = "1.0.1"
defmt-rtt = "1.1.0"
panic-probe = { version = "1.0.0", features = ["defmt"] }
rp-pac = { version = "7.0.0", features = ["cortex-m-rt", "rp2040"] }
heapless = "0.9.3"
modular-bitfield = "0.13.1"
enumflags2 = { version = "0.7.12", features = ["serde"] }
rotary-encoder-hal = { version = "0.6.0", features = ["defmt"] }
embedded-hal = "1.0.0"
either = { version = "1.16.0", default-features = false }


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"


[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"
